name: Refresh data (no-Databricks fallback)

# The production path is the Databricks job, which scrapes, builds the medallion
# tables and pushes JSON here itself (see databricks/04_export_static.py).
#
# This workflow is the standalone alternative: it runs the same scraper and the
# same aggregation logic inside Actions and commits the result. Useful if you
# want the site to keep working without a Databricks workspace, or to compare the
# two paths against each other.
#
# Manual by default. The scrape makes ~2,800 polite requests to a nonprofit's
# server and takes roughly an hour - do not put it on a frequent schedule.

on:
  workflow_dispatch:
    inputs:
      years:
        description: "Election years (space separated)"
        default: "2004 2009 2014 2019 2024"
        required: true
      delay:
        description: "Seconds between requests (do not go below 0.5)"
        default: "1.0"
        required: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The scraper is stdlib-only by design, so there is nothing to install.

      - name: Scrape myneta.info
        working-directory: pipeline
        run: |
          python scrape_local.py \
            --years ${{ inputs.years }} \
            --delay ${{ inputs.delay }} \
            --out ../data/raw \
            --cache ../.cache

      - name: Fetch MPLADS fund data (eSAKSHI)
        working-directory: pipeline
        # Non-fatal: the dashboard degrades gracefully (card hides) if the
        # portal is down; election data should still refresh.
        continue-on-error: true
        run: python fetch_mplads.py --out ../data/raw --cache ../.cache/mplads

      - name: Build static payloads
        working-directory: pipeline
        run: python build_static.py --raw ../data/raw --out ../docs/data

      - name: Verify parser still matches the site
        working-directory: pipeline
        run: python test_parser.py

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --staged --quiet; then
            echo "no data changes"
          else
            git commit -m "data: refresh from myneta.info ($(date -u +%Y-%m-%d))"
            git push
          fi
