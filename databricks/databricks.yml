# Databricks Asset Bundle - deploy the MyNeta pipeline as a scheduled job.
#
#   databricks bundle validate
#   databricks bundle deploy  -t dev
#   databricks bundle run myneta_pipeline -t dev
#
# Targets default to serverless compute, which is what Databricks Free Edition
# provides. No cluster definitions are needed and none are included.

bundle:
  name: myneta-dashboard

variables:
  catalog:
    description: Unity Catalog to build into.
    default: workspace
  schema:
    description: Schema holding bronze/silver/gold tables.
    default: myneta
  github_repo:
    description: "owner/name of the GitHub Pages repo. Blank = write to Volume only."
    default: ""
  github_branch:
    default: main
  years:
    description: Election years to ingest.
    default: "2004,2009,2014,2019,2024"

resources:
  jobs:
    myneta_pipeline:
      name: "MyNeta dashboard - ingest, transform, publish"
      description: >-
        Scrapes candidate affidavit data from myneta.info, builds medallion tables,
        and publishes pre-aggregated JSON to the GitHub Pages repo that serves the
        public dashboard.

      # Quarterly is plenty: ADR restates figures occasionally, but Lok Sabha
      # elections are five years apart. Bump to monthly around an election.
      schedule:
        quartz_cron_expression: "0 0 3 1 1/3 ? *"   # 03:00 UTC, 1st of every 3rd month
        timezone_id: UTC
        pause_status: PAUSED                         # unpause once you've run it by hand

      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}

      # A scrape that overruns has usually hit a site layout change - fail, don't hang.
      timeout_seconds: 10800

      tasks:
        - task_key: bronze_ingest
          notebook_task:
            notebook_path: ../databricks/01_bronze_ingest.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              years: ${var.years}
              limit_per_year: "0"

        - task_key: silver_clean
          depends_on:
            - task_key: bronze_ingest
          notebook_task:
            notebook_path: ../databricks/02_silver_clean.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: gold_marts
          depends_on:
            - task_key: silver_clean
          notebook_task:
            notebook_path: ../databricks/03_gold_marts.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: export_static
          depends_on:
            - task_key: gold_marts
          notebook_task:
            notebook_path: ../databricks/04_export_static.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              volume: exports
              github_repo: ${var.github_repo}
              github_branch: ${var.github_branch}
              data_path: docs/data
              secret_scope: myneta
              secret_key: github_token

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://<your-workspace>.cloud.databricks.com

  prod:
    mode: production
    workspace:
      host: https://<your-workspace>.cloud.databricks.com
    resources:
      jobs:
        myneta_pipeline:
          schedule:
            pause_status: UNPAUSED
